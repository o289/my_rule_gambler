name: STG checks

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx vp lint src vite.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: node --import tsx --test src/dev/tests/*.test.ts

      - name: Build
        run: npm run build
